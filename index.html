<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Escape from Tarkov maps and raid planner: next quests, keys, found-in-raid items, spawns, extracts and Kord Breach tracking."
    />
    <meta name="theme-color" content="#07090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d11'/%3E%3Cpath d='M16 5 27 27H5Z' fill='none' stroke='%23c9b287' stroke-width='2.5' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='19' r='3' fill='%23c9b287'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://assets.tarkov.dev" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!--
      Social preview. Without these, sharing a link anywhere renders a bare URL,
      which is the single cheapest thing that makes a finished site look
      unfinished. og.png is generated by `npm run og` and committed.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tarkov Maps" />
    <meta property="og:title" content="Tarkov Maps &amp; Quest Tracker" />
    <meta
      property="og:description"
      content="Spawns, extracts, keys and every task objective — and a tracker that puts your own quests on the map without being asked."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tarkov Maps and quest tracker: 13 maps, 528 tasks, PvP, Season and PvE."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Tarkov Maps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
